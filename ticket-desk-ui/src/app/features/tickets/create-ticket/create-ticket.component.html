<div class="page-container">

  <div class="page-header">
    <div>
      <h1>Create Support Ticket</h1>
      <p>Submit a new request to the support team.</p>
    </div>
  </div>

  <div class="form-card">

    <form [formGroup]="ticketForm" (ngSubmit)="submitTicket()">

      <div class="form-group">
        <label>Ticket Title</label>
        <input type="text"
               formControlName="title"
               placeholder="Enter a short title" />

        <small *ngIf="ticketForm.get('title')?.touched && ticketForm.get('title')?.invalid">
          Title is required.
        </small>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea rows="5"
                  formControlName="description"
                  placeholder="Describe your issue in detail..."></textarea>

        <small *ngIf="ticketForm.get('description')?.touched && ticketForm.get('description')?.invalid">
          Description is required.
        </small>
      </div>

      <div class="form-group">
        <label>Priority</label>

        <select formControlName="priority">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()">
          Cancel
        </button>

        <button type="submit" class="submit-btn" [disabled]="loading">
          {{ loading ? 'Submitting...' : 'Submit Ticket' }}
        </button>
      </div>

    </form>

  </div>
</div>
